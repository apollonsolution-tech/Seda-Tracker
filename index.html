<script src="config.js"></script>
<style>
:root{
  --teal:#1b5450; --teal-2:#246b66; --green:#7cbf2c; --gold:#e8b52b;
  --bg:#f4f6f5; --card:#fff; --ink:#1d2523; --muted:#66716e; --line:#e2e7e5;
  --red:#c8412d; --red-bg:#fdecea; --amber-bg:#fff6dc; --green-bg:#eaf6dd; --blue-bg:#e6f0f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--teal);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:42px;background:#fff;border-radius:8px;padding:3px}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.8}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}
nav{display:flex;gap:4px;padding:0 20px;background:var(--teal-2);overflow-x:auto}
nav button{background:none;border:0;color:#d6e6e3;padding:11px 14px;font:inherit;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
nav .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:5px}
main{max-width:1440px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;padding:8px 10px;border:1px solid #cdd5d2;border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--teal-2)}
.btn.ghost{background:#fff;color:var(--teal)}
.btn.ghost:hover{background:#f0f5f4}
.btn.green{background:#4f8f17;border-color:#4f8f17}
.btn.warn{background:#fff;color:#a4621a;border-color:#d99a3f}
.btn.danger{background:#fff;color:var(--red);border-color:#e3a59b}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--teal);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:#fff;color:var(--teal);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#fafbfb}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.t-res{background:var(--blue-bg);color:#245a80}
.t-com{background:#efe8fb;color:#5b3d96}
.s-pending{background:var(--amber-bg);color:#8a6512}
.s-complete{background:var(--green-bg);color:#3d7311}
.s-different{background:var(--red-bg);color:var(--red)}
.t-ccc{background:#fff1c2;color:#7a5a00;border:1px solid #f0d56b}
.s-pay{background:#fde8d4;color:#9a4a0b}
.s-verify{background:var(--blue-bg);color:#245a80}
.s-inv{background:#eceff1;color:#4a5458}
.alert{background:var(--red-bg);border:1px solid #f0bcb3;color:#7d2416;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.alert b{color:var(--red)}
.note{background:var(--amber-bg);border:1px solid #f1dc9c;border-radius:10px;padding:10px 12px;font-size:13px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.qitem .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qitem .name{font-weight:600;font-size:15px}
.qitem .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.opt{font:inherit;font-weight:600;border:1px solid #cdd5d2;background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.opt.on{border-color:var(--teal);background:#e8f1ef;color:var(--teal)}
.opt:disabled{opacity:.5}
.qgrid{display:grid;grid-template-columns:130px 1fr;gap:12px 10px;align-items:center;margin-top:12px}
@media(max-width:600px){.qgrid{grid-template-columns:1fr}}
.qlbl{font-weight:600;font-size:13px;color:var(--muted)}
.chk{display:inline-flex;gap:7px;align-items:center;font-weight:500;cursor:pointer;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--teal)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tot{font-size:20px;font-weight:700;color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2523;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px}
.modal.wide{max-width:860px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* invoice preview */
.inv{font-family:Calibri,Carlito,Arial,sans-serif;color:#000;font-size:11px;padding:24px 30px;border:1px solid var(--line)}
.inv .hd{display:flex;justify-content:space-between}
.inv .title{font-size:30px;line-height:1}
.inv table td,.inv table th{border:0;padding:1px 4px;font-size:11px;background:none;text-transform:none;letter-spacing:0;color:#000;font-weight:400}
.inv table thead th{border-bottom:1px solid #000;font-size:12px}
.inv .sec td{padding-top:8px}
.tiers td{padding:4px}
.inv2{font-family:Helvetica,Arial,sans-serif;color:#212524;font-size:12px;border:1px solid var(--line);background:#fff}
.inv2 .band{height:9px;background:var(--teal);border-bottom:3px solid var(--gold)}
.inv2 .ihd{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 26px 6px}
.inv2 .co{display:flex;gap:12px;align-items:center}.inv2 .co img{height:76px}
.inv2 .cn{font-weight:700;color:var(--teal);font-size:14px}.inv2 .cr{color:#6e7875;font-size:11px}
.inv2 .it{text-align:right}.inv2 .big{font-size:34px;font-weight:700;color:var(--teal);letter-spacing:.5px}
.inv2 .meta{background:#edf4f2;border-radius:6px;padding:8px 12px;margin-top:6px;min-width:220px}
.inv2 .meta div{display:flex;justify-content:space-between;gap:20px;padding:2px 0}.inv2 .meta span{color:#6e7875;font-size:10px}
.inv2 .bill{margin:10px 26px;background:#edf4f2;border-left:3px solid var(--green);border-radius:6px;padding:10px 14px;width:55%}
.inv2 .lbl{font-weight:700;color:var(--teal);font-size:10px;margin-bottom:4px}
.inv2 .itab{width:calc(100% - 52px);margin:12px 26px 0;border-collapse:separate;border-spacing:0}
.inv2 .itab th{background:var(--teal);color:#fff;font-size:10px;padding:8px 10px;text-transform:none;letter-spacing:0;border:0}
.inv2 .itab th:first-child{border-radius:4px 0 0 4px}.inv2 .itab th:last-child{border-radius:0 4px 4px 0}
.inv2 .itab td{border:0;padding:5px 10px;font-size:11px}
.inv2 .ish td{background:#edf4f2;color:var(--teal);font-weight:700;border-left:3px solid var(--green);padding-top:7px;padding-bottom:7px}
.inv2 .ish td+td{border-left:0}.inv2 tr.z td{background:#f8faf9}.inv2 .nm{padding-left:18px!important}
.inv2 .c{text-align:center}.inv2 .r{text-align:right}
.inv2 .iend{display:flex;gap:20px;margin:16px 26px 0;padding-top:14px;border-top:1.5px solid var(--teal)}
.inv2 .lft{flex:1}.inv2 .words{background:#edf4f2;border-radius:6px;padding:10px;font-weight:700;font-size:11px}
.inv2 .pay{border:1px solid var(--gold);border-radius:6px;padding:10px;margin-top:10px;font-size:11px}
.inv2 .tots{width:230px}.inv2 .tots div{display:flex;justify-content:space-between;padding:3px 10px;font-size:11px}.inv2 .tots span{color:#6e7875}
.inv2 .tots .g{background:var(--teal);color:#fff;border-radius:6px;padding:8px 10px;margin-top:4px;font-size:14px}.inv2 .tots .g span{color:#fff;font-size:11px;font-weight:700}
.inv2 .ift{text-align:center;color:#6e7875;font-weight:700;font-size:10px;padding:26px 0 10px}
.tiers input{width:110px}
#auth{position:fixed;inset:0;background:linear-gradient(160deg,#1b5450,#246b66);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#auth .box{background:#fff;border-radius:14px;width:100%;max-width:380px;padding:28px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#auth img{height:84px;display:block;margin:0 auto 6px}
#auth h2{text-align:center;margin:4px 0 2px;font-size:18px;color:var(--teal)}
#auth .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}
#auth label.f{margin-bottom:12px}
#auth .btn{width:100%;padding:10px}
#auth .lnk{background:none;border:0;color:var(--teal);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
#auth .msg{font-size:13px;margin:10px 0 0;min-height:18px}
#auth .msg.err{color:var(--red)} #auth .msg.ok{color:#3d7311}
.who-email{opacity:.85}
.btn.out{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;padding:5px 10px;font-size:12px}
</style>
</head>

const num = v=>{const n=parseFloat(v);return isFinite(n)?n:0};

function modal(html,{wide=false}={}){ $("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal ${wide?"wide":""}">${html}</div></div>`; }

const ROUND_FIELDS=["status","appliedKwac","appliedAt","appliedMonth","diffAck","adminNote","ccc","atapPaid","atapPaidAt","atapApproved","atapApprovedAt",
  "tnbSubmitted","tnbSubmittedAt","tnbPaid","tnbPaidAt","wlReceived","wlAt","billedAtap","billedWl","billedRefs","invoiceNo","cccApp"];
function refsOf(a,st){ return st==="wl" ? (a.billedWl||[]) : (a.billedAtap || a.billedRefs || []); }
function casRate(kw,cfg){
  // first band: min <= kWac <= max ; later bands: min < kWac <= max
  const t=[...(cfg.casTiers||[])].sort((x,y)=>num(x.min)-num(y.min));
  for(let i=0;i<t.length;i++){ const lo=num(t[i].min), hi=num(t[i].max); if((i===0?kw>=lo:kw>lo) && kw<=hi) return num(t[i].rate); }
  return 0;
}
function stApplies(kw,cfg){ return kw>=num(cfg.stMin) && kw<=num(cfg.stMax); }
function price(a,cfg=S.cfg){
  const kw=usedKwac(a); const com=a.type==="commercial";
  const drawing = com ? comDrawingRate(kw,cfg) : num(cfg.resDrawing);
  const seda = r2(kw*num(cfg.sedaRate));
  const tnb = tnbBy(a)==="apollon" ? tnbAmt(a,cfg) : 0;
  const cas = com ? casRate(kw,cfg) : 0;
  const st = com && stApplies(kw,cfg);
  const kwp = num(a.kwp);
  const stFee = st ? r2(kwp*num(cfg.stPerKwp)) : 0;
  const stProc = st ? num(cfg.stProc) : 0;
  const kwpMissing = st && !(kwp>0);
  return {kw, kwp, drawing, seda, tnb, cas, stFee, stProc, kwpMissing, total: r2((drawing||0)+seda+tnb+cas+stFee+stProc)};
}

let sb=null; const ME={id:null,email:"",role:null}; let USERS=[];
const cache={}, listeners={}, errListeners={}, subscribed={}, refreshT={};
function wrapErr(e){ console.error(e); return {code:"invalid_argument",message:(e&&e.message)||String(e)}; }
async function loadTable(t){
  let all=[], from=0;
  for(;;){ const {data,error}=await sb.from(t).select("id,data").range(from,from+999); if(error) throw error;
    all=all.concat(data); if(data.length<1000) break; from+=1000; }
  cache[t]=new Map(all.map(r=>[r.id,r.data])); (listeners[t]||[]).forEach(f=>f());
}
function refresh(t){ clearTimeout(refreshT[t]); refreshT[t]=setTimeout(()=>loadTable(t).catch(e=>console.error(e)),250); }
function ensureSub(t){
  if(subscribed[t]) return; subscribed[t]=true;
  loadTable(t).catch(e=>(errListeners[t]||[]).forEach(f=>f(wrapErr(e))));
  try{ sb.channel("rt-"+t).on("postgres_changes",{event:"*",schema:"public",table:t},()=>refresh(t)).subscribe(); }catch(e){}
  setInterval(()=>refresh(t),30000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(t); });
}
function snapDoc(t,id){ const d=cache[t]&&cache[t].get(id); return {id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}; }
function listen(t,f,err){ (listeners[t]=listeners[t]||[]).push(f); if(err)(errListeners[t]=errListeners[t]||[]).push(err); if(cache[t]) setTimeout(f); ensureSub(t); return ()=>{}; }
function docRef(t,id){ return { id, path:t+"/"+id,
  get: async()=>{ await loadTable(t); return snapDoc(t,id); },
  set: async d=>{ const {error}=await sb.from(t).upsert({id,data:d}); if(error) throw wrapErr(error); if(cache[t]) cache[t].set(id,d); (listeners[t]||[]).forEach(f=>f()); refresh(t); },
  update: async p=>{ const {error}=await sb.rpc("patch_doc",{p_table:t,p_id:id,p_patch:p}); if(error) throw wrapErr(error);
    const cur=cache[t]&&cache[t].get(id); if(cur) cache[t].set(id,{...cur,...p}); (listeners[t]||[]).forEach(f=>f()); refresh(t); },
  delete: async()=>{ const {error}=await sb.from(t).delete().eq("id",id); if(error) throw wrapErr(error); if(cache[t]) cache[t].delete(id); (listeners[t]||[]).forEach(f=>f()); refresh(t); },
  onSnapshot: (next,err)=>listen(t,()=>next(snapDoc(t,id)),err)
};}
const newId=()=> (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const DB={
  collection:t=>({ path:t, doc:id=>docRef(t,id||newId()), add:async d=>{ const r=docRef(t,newId()); await r.set(d); return r; },
    onSnapshot:(next,err)=>listen(t,()=>{ const docs=[...cache[t].keys()].map(id=>snapDoc(t,id)); next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}); },err) }),
  doc:p=>{ const [t,id]=p.split("/"); return docRef(t,id); },
  bulkAdd: async(t,arr)=>{ for(let i=0;i<arr.length;i+=200){ const rows=arr.slice(i,i+200).map(d=>({id:newId(),data:d}));
    const {error}=await sb.from(t).insert(rows); if(error) throw wrapErr(error); } refresh(t); }
};

async function start(){

  sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY") showNewPassword(); });

/* ---------- step-by-step flow ----------
   ATAP:  submit (admin) -> fee paid (owner) -> approved (admin)
   TNB :  submitted (admin) -> fee paid (owner) -> welcome letter received (admin) */
function flag(a,k){
  if(a[k]!==undefined && a[k]!==null) return !!a[k];
  // records made before step tracking: a received welcome letter means every step was done
  if(k==="atapPaid"||k==="atapApproved"||k==="tnbSubmitted"||k==="tnbPaid") return a.status!=="pending" && !!a.wlReceived;
  return false;
}
function stage(a){
  if(a.status==="pending") return "atap_submit";
  if(!flag(a,"atapPaid")) return "atap_pay";
  if(!flag(a,"atapApproved")) return "atap_verify";
  if(!flag(a,"tnbSubmitted")) return "tnb_submit";
  if(!flag(a,"tnbPaid")) return "tnb_pay";
  if(!a.wlReceived) return "tnb_wl";
  return "closed";
}
const STEP={
  atap_submit:["ATAP: Waiting submission","s-pending"],
  atap_pay:["ATAP: Waiting for Fee Payment","s-pay"],
  atap_verify:["ATAP: Waiting for Verification","s-verify"],
  tnb_submit:["TNB: Waiting submission","s-pending"],
  tnb_pay:["TNB: Waiting for Fee Payment","s-pay"],
  tnb_wl:["TNB: Pending Welcome Letter","s-verify"],
  closed:["Complete","s-complete"]};
const ADMIN_STEPS=["atap_submit","atap_verify","tnb_submit","tnb_wl"], OWNER_STEPS=["atap_pay","tnb_pay"];
function stepTag(a){ const [l,c]=STEP[stage(a)]; return `<span class="tag ${c}">${l}</span>`; }
const dt=ts=>ts?fmtDate(ts):"";
function payBox(a,which){ // owner's fee-paid tick
  const k=which==="atap"?"atapPaid":"tnbPaid", locked=which==="atap"?flag(a,"atapApproved"):!!a.wlReceived;
  return `<label class="chk" style="font-size:12px;margin-top:4px"><input type="checkbox" data-pay="${which}" data-id="${a.id}" ${flag(a,k)?"checked":""} ${locked||a.invoiceNo?"disabled":""}> Fee paid</label>`;
}
function atapCell(a,owner){
  const st=stage(a);
  if(st==="atap_submit") return `<span class="tag s-pending">Waiting submission</span>`;
  const diff=a.status==="different"?` <span class="tag s-different">different kWac${a.diffAck?" (noted)":""}</span>`:"";
  if(st==="atap_pay") return `<span class="tag s-pay">Waiting for Fee Payment</span>${diff}${owner?`<div>${payBox(a,"atap")}</div>`:""}`;
  if(st==="atap_verify") return `<span class="tag s-verify">Waiting for Verification</span>${diff}${owner?`<div>${payBox(a,"atap")}</div>`:""}`;
  return `<span class="tag s-complete">Approved${withCCC(a)?", with CCC":""} ✓ ${dt(a.atapApprovedAt)}</span>${diff}`;
}
function tnbCell(a,owner){
  const st=stage(a);
  if(["atap_submit","atap_pay","atap_verify"].includes(st)) return `<span class="muted" style="font-size:12px">After ATAP approval</span>`;
  if(st==="tnb_submit") return `<span class="tag s-pending">Waiting submission</span>`;
  if(st==="tnb_pay") return `<span class="tag s-pay">Waiting for Fee Payment</span>${owner?`<div>${payBox(a,"tnb")}</div>`:""}`;
  if(st==="tnb_wl") return `<span class="tag s-verify">Pending Welcome Letter</span>${owner?`<div>${payBox(a,"tnb")}</div>`:""}`;
  return `<span class="tag s-complete">Welcome Letter ✓ ${dt(a.wlAt)}</span>`;
}
function atapTag(a){ return atapCell(a,false); }
function wlTag(a){ return tnbCell(a,false); }
function billTags(a){

/* ---------- bulk import of already-completed applications ---------- */
function parseDate(v){
  v=String(v||"").trim(); if(!v) return null;
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);           // 13/11/2026 (day first)
  if(m){ let y=+m[3]; if(y<100) y+=2000; const d=new Date(y,+m[2]-1,+m[1]); return isNaN(d)?null:d.getTime(); }
  m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);                  // 2026-11-13
  if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d.getTime(); }
  m=v.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-,]*(\d{2,4})$/);           // 13-Nov-2026 / 13 Nov 2026
  if(m){ const mi=MON.findIndex(x=>m[2].slice(0,3).toLowerCase()===x.toLowerCase()); let y=+m[3]; if(y<100) y+=2000; if(mi>=0) return new Date(y,mi,+m[1]).getTime(); }
  m=v.match(/^([A-Za-z]{3,})[\s\-,]*(\d{4})$/);                              // Nov 2026
  if(m){ const mi=MON.findIndex(x=>m[1].slice(0,3).toLowerCase()===x.toLowerCase()); if(mi>=0) return new Date(+m[2],mi,15).getTime(); }
  return null;
}
function parseImport(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const existing=new Set(S.apps.map(a=>a.name.trim().toUpperCase()));
  const seen=new Set(); const rows=[];
  lines.forEach((line,i)=>{
    const c=(line.includes("\t")?line.split("\t"):line.split(",")).map(x=>x.trim());
    if(i===0 && /name/i.test(c[0]||"") ) return;                              // header row
    const r={line:i+1,name:c[0]||"",errs:[],warns:[]};
    const t=(c[1]||"").toLowerCase();
    r.type = /^(c|com|commercial|c&i|ci|c & i)/.test(t)?"commercial": /^(r|res|residential)/.test(t)?"residential":null;
    r.kwac = c[2]===""||c[2]==null?NaN:parseFloat(String(c[2]).replace(/[^\d.]/g,""));
    r.kwp  = c[3]?parseFloat(String(c[3]).replace(/[^\d.]/g,"")):null;
    r.date = c[4]?parseDate(c[4]):Date.now(); r.dateRaw=c[4]||"";

    if(!(r.kwac>0)) r.errs.push("kWac missing");

    if(r.type==="commercial"&&r.kwac>0&&stApplies(r.kwac,S.cfg)&&!(r.kwp>0)) r.warns.push("kWp needed for ST License — add later with Edit");

    if(seen.has(key)) r.warns.push("listed twice in this paste");
    seen.add(key); rows.push(r);
  });

}

function billedTag(a,st){
  const refs=refsOf(a,st);
  if(!refs.length) return `<span class="tag s-pending">Not billed</span>`;
  const t=refs.map(r=>esc(r.ref||"no ref")+" · "+fmtDate(r.at)).join("<br>");
  return refs.length>1?`<span class="tag s-different">Billed ${refs.length}× ⚠</span><div class="muted" style="font-size:11px;margin-top:3px">${t}</div>`
    :`<span class="tag s-complete">Billed</span><div class="muted" style="font-size:11px;margin-top:3px">${t}</div>`;
}
const STAGE={atap:"ATAP Application",wl:"TNB Application"};
function stageBase(st){ return S.apps.filter(a=>st==="wl"?!!a.wlReceived:a.status!=="pending"); }
function stageAmt(a,st){ return num(st==="wl"?S.cfg.billWl:S.cfg.billAtap); }
function vBilling(){
  const st=S.bStage||"atap";
  const base=stageBase(st);
  const months=[...new Set(base.map(a=>st==="wl"?(a.wlAt&&monthKey(a.wlAt)):a.appliedMonth).filter(Boolean))].sort().reverse();
  const mOf=a=>st==="wl"?(a.wlAt&&monthKey(a.wlAt)):a.appliedMonth;
  let list=base.filter(a=>S.bMonth==="all"||mOf(a)===S.bMonth)
    .filter(a=>S.bShow==="all"||(S.bShow==="billed"?refsOf(a,st).length:!refsOf(a,st).length));
  if(S.bSearch) list=list.filter(a=>a.name.toLowerCase().includes(S.bSearch.toLowerCase()));
  list.sort((a,b)=>(st==="wl"?(a.wlAt||0)-(b.wlAt||0):(a.appliedAt||0)-(b.appliedAt||0)));
  for(const id of [...S.bSel]) if(!base.find(a=>a.id===id)) S.bSel.delete(id);
  const chosen=base.filter(a=>S.bSel.has(a.id));
  const tot=r2(chosen.reduce((x,a)=>x+stageAmt(a,st),0));
  const dups=S.apps.filter(a=>refsOf(a,"atap").length>1||refsOf(a,"wl").length>1);
  const allSel=list.length&&list.every(a=>S.bSel.has(a.id));
  const nb=base.filter(a=>!refsOf(a,st).length).length;
  return `${dups.length?`<div class="alert"><b>⚠ Billed more than once (${dups.length})</b><br>${dups.map(a=>["atap","wl"].filter(x=>refsOf(a,x).length>1).map(x=>`${esc(a.name)} — ${STAGE[x]}: ${refsOf(a,x).map(r=>esc(r.ref||"no ref")).join(", ")}`).join("<br>")).join("<br>")}</div>`:""}
  <div class="card"><h2>Billing check — tick what the admin has billed you for</h2>
  <div style="margin-bottom:12px"><div class="seg">${["atap","wl"].map(k=>`<button data-act="bStage" data-v="${k}" class="${st===k?"on":""}">${k==="atap"?"1 · ":"2 · "}${STAGE[k]} billing</button>`).join("")}</div></div>
  <p class="muted" style="margin-top:-4px">She bills twice per applicant: <b>RM${money(S.cfg.billAtap)}</b> after the <b>ATAP Application</b> and <b>RM${money(S.cfg.billWl)}</b> after the <b>TNB Application</b> (Welcome Letter received). Pick the stage on her invoice, tick the applicants on it, enter her invoice number and press <b>Mark as billed</b>. Double billing within the same stage is flagged before saving. ${nb} application${nb===1?"":"s"} not billed for this stage yet.</p>
  <div class="row" style="margin-bottom:12px">
    <label class="f">${st==="wl"?"Letter received in":"ATAP applied in"}<select id="bMonth"><option value="all">All months</option>${months.map(m=>`<option value="${m}" ${S.bMonth===m?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></label>
    <label class="f">Show<select id="bShow">${[["unbilled","Not billed yet"],["billed","Already billed"],["all","All"]].map(([k,l])=>`<option value="${k}" ${S.bShow===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f" style="flex:1;min-width:180px">Search name<input type="text" id="bSearch" value="${esc(S.bSearch)}" placeholder="Type to filter"></label>
  </div>
  ${list.length?`<div style="overflow-x:auto"><table><thead><tr><th><input type="checkbox" id="bAll" ${allSel?"checked":""} style="width:17px;height:17px;accent-color:var(--teal)"></th><th>Applicant</th><th>Type</th><th class="n">kWac</th><th class="n">Her charge (RM)</th><th>${st==="wl"?"Letter received":"ATAP applied"}</th><th>${STAGE[st]} billing</th><th></th></tr></thead><tbody>
  ${list.map(a=>{const p=price(a);const amt=stageAmt(a,st);return `<tr><td><input type="checkbox" data-bsel="${a.id}" ${S.bSel.has(a.id)?"checked":""} style="width:17px;height:17px;accent-color:var(--teal)"></td>
  <td><b>${esc(a.name)}</b></td><td>${typeTag(a.type)}</td><td class="n">${p.kw}</td><td class="n">${money(amt)}</td>
  <td class="muted">${st==="wl"?(a.wlAt?fmtDate(a.wlAt):""):(a.appliedAt?fmtDate(a.appliedAt):"")}</td><td>${billedTag(a,st)}</td>
  <td>${refsOf(a,st).length?`<button class="btn sm ghost" data-act="unbill" data-id="${a.id}">Unmark</button>`:""}</td></tr>`}).join("")}
  </tbody></table></div>`:`<div class="empty">Nothing to show.</div>`}
  </div>
  <div class="card"><div class="row">
    <div style="flex:1;min-width:200px"><div class="muted">Selected · ${STAGE[st]}</div><div style="font-size:16px;font-weight:600">${chosen.length} application${chosen.length===1?"":"s"} · expected RM ${money2(tot)}</div>
    <div class="muted" style="font-size:12px">Compare this with the total on her invoice.</div></div>
    <label class="f">Her invoice #<input type="text" id="bRef" value="${esc(S.bRef)}" placeholder="e.g. INA12013"></label>
    <button class="btn" data-act="markBilled" ${chosen.length?"":"disabled"}>Mark as billed</button>
    ${chosen.length?`<button class="btn ghost sm" data-act="bClear">Clear</button>`:""}
  </div></div>`;
}

  ${S.invoices.map(i=>`<tr><td><b>${esc(i.no)}</b></td><td>${esc(fmtDate(i.dateTs))}</td><td>${esc((i.billTo||"").split("\n")[0])}</td><td class="n">${(i.appIds||[]).length}</td><td class="n">${money2(i.total)}</td>

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-act]"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.setDirty=false; render(); if(S.tab==="users") loadUsers(); return; }
  const act=t.dataset.act, id=t.dataset.id, a=S.apps.find(x=>x.id===id);
  const ref=id?S.db.collection("apps").doc(id):null;
  try{
  switch(act){
    case "setType": S.newType=t.dataset.v; render(); break;
    case "gotoApps": S.tab="apps"; S.appFilter="different"; render(); break;
    case "appFilter": S.appFilter=t.dataset.v; render(); break;
    case "ack": await ref.update({diffAck:true}); toast("Noted"); break;
    case "del": if(await ask("Delete application?",`Remove <b>${esc(a.name)}</b>? This can't be undone.`,"Delete",true)){ await ref.delete(); toast("Deleted"); } break;
    case "edit": editApp(a); break;
    case "logout": await sb.auth.signOut(); location.reload(); break;
    case "impPreview": S.impText=$("#impText").value; S.imp=parseImport(S.impText); if(!S.imp.length) toast("Nothing to import — paste rows first"); render(); break;
    case "impClear": S.imp=null; S.impText=""; render(); break;
    case "impGo": { const n=(S.imp||[]).filter(r=>!r.errs.length).length; if(await ask(`Import ${n} application${n===1?"":"s"}?`,"They'll be added as complete (ATAP approved, Welcome Letter received), ready to invoice.","Import")) await runImport(); break; }
    case "bClear": S.bSel.clear(); render(); break;
    case "bStage": S.bStage=t.dataset.v; S.bSel.clear(); S.bMonth="all"; render(); break;
    case "unbill": if(await ask("Unmark as billed?",`Remove the ${STAGE[S.bStage||"atap"]} billing marks from <b>${esc(a.name)}</b>?`,"Unmark")){ await ref.update((S.bStage||"atap")==="wl"?{billedWl:[]}:{billedAtap:[],billedRefs:[]}); toast("Unmarked"); } break;
    case "markBilled": await markBilled(); break;
    case "qPick": { S.q[t.dataset.g+"_"+id]=t.dataset.v; render(); break; }
    case "atapSave": {
      const k=S.q["k_"+id]; const ak = k==="diff" ? num(S.q["ak_"+id]) : num(a.kwac);
      if(k!=="same"&&k!=="diff"){toast("Pick same or different kWac");return}
      if(k==="diff"&&(S.q["ak_"+id]==null||S.q["ak_"+id]===""||ak===num(a.kwac))){toast("Enter the kWac you applied");return}
      const now=Date.now();
      await ref.update({status:k==="diff"?"different":"complete",appliedKwac:ak,appliedAt:now,appliedMonth:monthKey(now),diffAck:false,adminNote:k==="diff"?(S.q["an_"+id]||"").trim():"",ccc:k==="same"&&!!S.q["cc_"+id]});
      ["k_","ak_","an_","cc_"].forEach(x=>delete S.q[x+id]);
      toast(k==="diff"?"ATAP submitted — owner alerted about the kWac difference":"ATAP submitted — waiting for fee payment"); break; }
    case "atapReset": if(await ask("Change ATAP answer?",`Clear the ATAP submission for <b>${esc(a.name)}</b>?`,"Change")){ await ref.update({status:"pending",appliedKwac:null,appliedAt:null,appliedMonth:null,diffAck:false,adminNote:"",ccc:false}); } break;
    case "cccApp": {
      if(!await ask("Start CCC Application?",`<b>${esc(a.name)}</b> goes back to the admin queue and runs through <b>ATAP Application</b> and <b>TNB Application</b> again (including your fee-paid ticks). Its status will show <b>Approved, with CCC</b> once ATAP is approved.<br><br>The completed round${a.invoiceNo?` (invoice ${esc(a.invoiceNo)})`:""} and its billing marks are kept in the history, and the CCC round can be invoiced and billed separately.`,"Start CCC Application")) break;
      const snap={round:(a.rounds||[]).length+1,closedAt:Date.now()}; ROUND_FIELDS.forEach(f=>{ if(a[f]!==undefined) snap[f]=a[f]; });
      await ref.update({rounds:[...(a.rounds||[]),snap],cccApp:true,status:"pending",appliedKwac:null,appliedAt:null,appliedMonth:null,diffAck:false,adminNote:"",ccc:false,
        atapPaid:false,atapPaidAt:null,atapApproved:false,atapApprovedAt:null,tnbSubmitted:false,tnbSubmittedAt:null,tnbPaid:false,tnbPaidAt:null,wlReceived:false,wlAt:null,
        billedAtap:[],billedWl:[],billedRefs:[],invoiceNo:null});
      toast("CCC Application started — it's back in the admin queue"); break; }
    case "cccUndo": {
      if(!await ask("Cancel CCC Application?",`<b>${esc(a.name)}</b> goes back to its completed state.`,"Cancel CCC")) break;
      const rs=[...(a.rounds||[])], last=rs.pop(); if(!last) break;
      const back={rounds:rs}; ROUND_FIELDS.forEach(f=>{ back[f]=last[f]===undefined?null:last[f]; });
      await ref.update(back); toast("CCC Application cancelled"); break; }
    case "reopen": if(await ask("Reopen case?",`<b>${esc(a.name)}</b> goes back to Pending Welcome Letter.`,"Reopen")){ await ref.update({wlReceived:false,wlAt:null}); } break;
    case "selMonth": eligible().filter(x=>x.appliedMonth===S.invMonth).forEach(x=>S.sel.add(x.id)); render(); break;
    case "clearSel": S.sel.clear(); render(); break;
    case "preview": { const inv=buildDraft(); modal(`<h3>Preview — ${esc(inv.no)}</h3>${invoiceHTML(inv)}<div class="btns"><button class="btn ghost" onclick="closeModal()">Close</button></div>`,{wide:true}); break; }
    case "generate": await generate(); break;
    case "hView": { const inv=S.invoices.find(i=>i.id===id); modal(`<h3>${esc(inv.no)}</h3>${invoiceHTML(inv)}<div class="btns"><button class="btn ghost" onclick="closeModal()">Close</button></div>`,{wide:true}); break; }
    case "hPdf": await downloadPDF(S.invoices.find(i=>i.id===id)); break;
    case "hVoid": {
      const inv=S.invoices.find(i=>i.id===id);
      if(await ask(`Void ${inv.no}?`,`The ${inv.appIds.length} application(s) on it become available to invoice again.`,"Void invoice",true)){
        for(const aid of inv.appIds){ const ap=S.apps.find(x=>x.id===aid); if(ap&&ap.invoiceNo===inv.no) await S.db.collection("apps").doc(aid).update({invoiceNo:null}); }
        await S.db.collection("invoices").doc(id).delete(); toast("Invoice voided"); }
      break; }
    case "tierAdd": { const tl=$("#tierBody")?[...$("#tierBody").querySelectorAll("tr")].map(r=>({max:r.querySelector(".tMax").value,rate:r.querySelector(".tRate").value})):[]; S.cfg={...S.cfg,...readSettings()}; S.cfg.comTiers=[...tl,{max:"",rate:""}]; S.setDirty=true; render(); break; }
    case "tierDel": { const tl=[...$("#tierBody").querySelectorAll("tr")].map(r=>({max:r.querySelector(".tMax").value,rate:r.querySelector(".tRate").value})); S.cfg={...S.cfg,...readSettings()}; tl.splice(+t.dataset.i,1); S.cfg.comTiers=tl; S.setDirty=true; render(); break; }
  }
  }catch(err){ dbErr(err); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.role){ sb.from("profiles").update({role:t.value}).eq("id",t.dataset.role).then(({error})=>{ if(error){toast("Couldn't change role");console.error(error);} else toast("Access updated"); loadUsers(); }); return; }
  if(t.dataset.tnbsel){ S.db.collection("apps").doc(t.dataset.tnbsel).update({tnbPaidBy:t.value}).then(()=>toast("TNB metering updated")).catch(dbErr); return; }
  if(t.dataset.tnbamt){ if(t.value===""){toast("Enter an amount");return} S.db.collection("apps").doc(t.dataset.tnbamt).update({tnbAmount:num(t.value)}).then(()=>toast("TNB amount saved")).catch(dbErr); return; }
  if(/^cc_/.test(t.id||"")){ S.q[t.id]=t.checked; return; }
  if(t.dataset.step||t.dataset.pay){
    const field=t.dataset.step || (t.dataset.pay==="atap"?"atapPaid":"tnbPaid");
    const atField={atapApproved:"atapApprovedAt",tnbSubmitted:"tnbSubmittedAt",wlReceived:"wlAt",atapPaid:"atapPaidAt",tnbPaid:"tnbPaidAt"}[field];
    const msg={atapApproved:"ATAP approved — TNB Application can start",tnbSubmitted:"TNB Application submitted — waiting for fee payment",wlReceived:"Welcome Letter received — case complete",
      atapPaid:"ATAP fee paid — admin will see Waiting for Verification",tnbPaid:"TNB fee paid — admin will see Pending Welcome Letter"}[field];
    S.db.collection("apps").doc(t.dataset.id).update({[field]:t.checked,[atField]:t.checked?Date.now():null})
      .then(()=>toast(t.checked?msg:"Unticked")).catch(dbErr); return; }
  if(t.dataset.bsel){ t.checked?S.bSel.add(t.dataset.bsel):S.bSel.delete(t.dataset.bsel); render(); return; }
  if(t.id==="bAll"){ [...document.querySelectorAll("[data-bsel]")].forEach(x=>t.checked?S.bSel.add(x.dataset.bsel):S.bSel.delete(x.dataset.bsel)); render(); return; }
  if(t.id==="bMonth"){ S.bMonth=t.value; render(); return; }
  if(t.id==="bShow"){ S.bShow=t.value; render(); return; }
  if(t.dataset.sel){ t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel); saveDraft(); render(); }
  else if(t.id==="selAll"){ const rows=[...document.querySelectorAll("[data-sel]")].map(x=>x.dataset.sel); rows.forEach(r=>t.checked?S.sel.add(r):S.sel.delete(r)); saveDraft(); render(); }
  else if(t.id==="invMonth"){ S.invMonth=t.value; saveDraft(); render(); }
  else if(t.id==="showInv"){ S.showInvoiced=t.checked; saveDraft(); render(); }
  else if(t.id==="dDate"){ const oldNo=$("#dNo").value, wasAuto=/^INV\d{4}-\d{4}$/.test(oldNo);
    saveDraft(); if(wasAuto){ S.draft.no=nextInvNo(S.draft.date); render(); } }
  else if(["dNo","dBill"].includes(t.id)) saveDraft();
});
document.addEventListener("input",e=>{ const id=e.target.id||"";
  if(e.target.closest&&e.target.closest("#setForm")) S.setDirty=true;

  if(id==="bRef") S.bRef=e.target.value;

  if(id==="bSearch"){ S.bSearch=e.target.value; render(); }
  if(e.target.id==="invSearch"){ S.invSearch=e.target.value; saveDraft(); render(); } });
async function markBilled(){
  const st=S.bStage||"atap", ref=S.bRef.trim();
  const chosen=S.apps.filter(a=>S.bSel.has(a.id));
  const already=chosen.filter(a=>refsOf(a,st).length);
  let toMark=chosen;
  if(already.length){
    const r=await new Promise(res=>{
      modal(`<h3 style="color:var(--red)">⚠ Possible double billing — ${STAGE[st]}</h3>
      <div>These were already billed for the ${STAGE[st]} stage:</div>
      <ul>${already.map(a=>`<li><b>${esc(a.name)}</b> — ${refsOf(a,st).map(x=>esc(x.ref||"no ref")+" on "+fmtDate(x.at)).join(", ")}</li>`).join("")}</ul>
      <div class="muted">${ref?`Her invoice ${esc(ref)} includes them again.`:"They're included again."} Check with the admin before paying.</div>
      <div class="btns"><button class="btn ghost" id="mC">Cancel</button>${already.length<chosen.length?`<button class="btn" id="mS">Skip these, mark the rest</button>`:""}<button class="btn danger" id="mA">Record as billed again</button></div>`);
      $("#mC").onclick=()=>{closeModal();res("c")}; if($("#mS")) $("#mS").onclick=()=>{closeModal();res("s")}; $("#mA").onclick=()=>{closeModal();res("a")};
    });
    if(r==="c") return;
    if(r==="s") toMark=chosen.filter(a=>!refsOf(a,st).length);
  }
  const at=Date.now();
  for(const a of toMark){
    const cur=refsOf(a,st);
    if(ref && cur.some(x=>x.ref===ref)) continue;
    await S.db.collection("apps").doc(a.id).update(st==="wl"?{billedWl:[...cur,{ref,at}]}:{billedAtap:[...cur,{ref,at}]});
  }
  S.bSel.clear(); S.bRef="";
  toast(`Marked ${toMark.length} as billed (${STAGE[st]})`);
}
function saveDraft(){ if(!$("#dNo")) return; S.draft={no:$("#dNo").value,date:$("#dDate").value,billTo:$("#dBill").value}; }

/* ---------- invoice building ---------- */
function buildDraft(){
  saveDraft();
  const chosen=S.apps.filter(a=>S.sel.has(a.id)).sort((a,b)=>(a.appliedAt||0)-(b.appliedAt||0));
  const rows=chosen.map(a=>({a,p:price(a)}));
  const L=(get)=>rows.filter(r=>get(r)>0).map(r=>({name:invName(r.a),unit:get(r),qty:1,amt:get(r)}));
  const sections=[
    {title:"Drawing & Endorsement for SEDA application submission",lines:L(r=>r.p.drawing)},
    {title:"SEDA application FEE",lines:L(r=>r.p.seda)},
    {title:"TNB Metering charges",lines:L(r=>r.p.tnb)},
    {title:"CAS Charges",lines:L(r=>r.p.cas)},
    {title:"ST License (annual)",lines:rows.filter(r=>r.p.stFee>0||r.p.stProc>0).flatMap(r=>[
      {name:invName(r.a)+` (${r.p.kwp} kWp × RM${S.cfg.stPerKwp})`,unit:num(S.cfg.stPerKwp),qty:r.p.kwp,amt:r.p.stFee},
      {name:invName(r.a)+" (processing fee)",unit:r.p.stProc,qty:1,amt:r.p.stProc}].filter(l=>l.amt>0))}].filter(s=>s.lines.length);
  const total=r2(rows.reduce((s,r)=>s+r.p.total,0));
  const d=S.draft.date?new Date(S.draft.date+"T00:00:00"):new Date();
  return {no:S.draft.no.trim(),dateTs:d.getTime(),billTo:S.draft.billTo,issuerName:S.cfg.issuerName,issuerReg:S.cfg.issuerReg,noteText:S.cfg.noteText,
    sections,total,appIds:chosen.map(a=>a.id),createdAt:Date.now()};
}
async function generate(){
  const inv=buildDraft();
  if(!inv.no){toast("Enter an invoice number");return}
  if(S.invoices.some(i=>i.no===inv.no)){ if(!await ask("Invoice number already used",`${esc(inv.no)} already exists. Use it anyway?`,"Use anyway")) return; }
  const already=S.apps.filter(a=>inv.appIds.includes(a.id)&&a.invoiceNo);
  if(already.length && !await ask("Already invoiced",`${already.map(a=>esc(a.name)+" ("+esc(a.invoiceNo)+")").join(", ")} ${already.length>1?"are":"is"} already on an invoice. Include again?`,"Include")) return;
  await S.db.collection("invoices").doc().set(inv);
  for(const id of inv.appIds) await S.db.collection("apps").doc(id).update({invoiceNo:inv.no});
  const m=inv.no.match(/^INV(\d{4})-(\d{4,})$/);
  if(m && +m[2]>num((S.cfg.invSeq||{})[m[1]])) await S.db.doc("config/main").set({...S.cfg,invSeq:{...(S.cfg.invSeq||{}),[m[1]]:+m[2]}});
  S.sel.clear(); S.draft=null;
  toast(`Invoice ${inv.no} saved`);
  await downloadPDF(inv);
}

/* amount in words */
function words(n){
  const a=["","ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN","ELEVEN","TWELVE","THIRTEEN","FOURTEEN","FIFTEEN","SIXTEEN","SEVENTEEN","EIGHTEEN","NINETEEN"];
  const b=["","","TWENTY","THIRTY","FORTY","FIFTY","SIXTY","SEVENTY","EIGHTY","NINETY"];
  const h=n=>{let s="";if(n>=100){s+=a[Math.floor(n/100)]+" HUNDRED";n%=100;if(n)s+=" AND ";}
    if(n>=20){s+=b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"")}else if(n>0)s+=a[n];return s};
  if(n===0) return "ZERO";
  const parts=[[1e9,"BILLION"],[1e6,"MILLION"],[1e3,"THOUSAND"]]; let out=[];
  for(const [v,l] of parts){ if(n>=v){ out.push(h(Math.floor(n/v))+" "+l); n%=v; } }
  if(n){ out.push((out.length&&n<100?"AND ":"")+h(n)); }
  return out.join(" ");
}
function amountWords(t){ const rm=Math.floor(t+1e-9), sen=Math.round((t-rm)*100);
  return "RINGGIT MALAYSIA : "+words(rm)+(sen?" AND SEN "+words(sen):"")+" ONLY"; }

function invoiceHTML(inv){
  const sec=inv.sections.map(sc=>{const sub=r2(sc.lines.reduce((x,l)=>x+l.amt,0));
    return `<tr class="ish"><td colspan="3">${esc(sc.title)}</td><td class="r">${money2(sub)}</td></tr>`+
    sc.lines.map((l,i)=>`<tr class="${i%2?"z":""}"><td class="nm">-${esc(l.name)}</td><td class="c">${money(l.unit)}</td><td class="c">${l.qty}</td><td class="r">${money(l.amt)}</td></tr>`).join("")}).join("");
  return `<div class="inv2">
  <div class="band"></div>
  <div class="ihd"><div class="co"><img src="${LOGO}"><div><div class="cn">${esc(inv.issuerName)}</div><div class="cr">${esc(inv.issuerReg)}</div></div></div>
   <div class="it"><div class="big">INVOICE</div><div class="meta"><div><span>INVOICE #</span><b>${esc(inv.no)}</b></div><div><span>INVOICE DATE</span><b>${esc(fmtDate(inv.dateTs))}</b></div></div></div></div>
  <div class="bill"><div class="lbl">BILL TO</div><div style="white-space:pre-line">${esc(inv.billTo)}</div></div>
  <table class="itab"><thead><tr><th>DESCRIPTION</th><th class="c">UNIT PRICE (RM)</th><th class="c">QUANTITY</th><th class="r">AMOUNT (RM)</th></tr></thead><tbody>${sec}</tbody></table>
  <div class="iend"><div class="lft"><div class="words">${esc(amountWords(inv.total))}</div>
    <div class="pay"><div class="lbl">NOTE</div><div style="white-space:pre-line">${esc(inv.noteText)}</div></div></div>
   <div class="tots"><div><span>TOTAL</span><b>${money2(inv.total)}</b></div><div><span>NET</span><b>${money2(inv.total)}</b></div><div><span>TAX</span><b>0.00</b></div><div><span>ROUNDING ADJUSTMENT</span><b>0.00</b></div><div class="g"><span>GROSS (RM)</span><b>${money2(inv.total)}</b></div></div></div>
  <div class="ift">THIS IS COMPUTER GENERATED INVOICE · NO SIGNATURE IS REQUIRED</div><div class="band" style="height:5px"></div></div>`;
}

function makePDF(inv){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const W=595.28,H=841.89,L=40,R=W-40,CW=R-L;
  const TEAL=[27,84,80],GREEN=[124,191,44],GOLD=[232,181,43],LIGHT=[237,244,242],ZEB=[248,250,249],INK=[33,37,36],MUTED=[110,120,117];
  const cD=L+12, cU=L+CW*0.62, cQ=L+CW*0.76, cA=R-10;
  const fill=c=>doc.setFillColor(...c), txt=c=>doc.setTextColor(...c), F=(st,sz)=>{doc.setFont("helvetica",st);doc.setFontSize(sz)};
  const bands=()=>{ fill(TEAL); doc.rect(0,0,W,10,"F"); fill(GOLD); doc.rect(0,10,W,2.5,"F"); fill(TEAL); doc.rect(0,H-8,W,8,"F"); };
  const tableHead=y=>{ fill(TEAL); doc.roundedRect(L,y,CW,22,3,3,"F"); txt([255,255,255]); F("bold",8);
    doc.text("DESCRIPTION",cD,y+14); doc.text("UNIT PRICE (RM)",cU,y+14,{align:"center"}); doc.text("QUANTITY",cQ,y+14,{align:"center"}); doc.text("AMOUNT (RM)",cA,y+14,{align:"right"}); return y+28; };
  const firstHeader=()=>{
    bands();
    doc.addImage(LOGO,"JPEG",L,28,80,73);
    txt(TEAL); F("bold",11); doc.text(inv.issuerName,L+90,58); txt(MUTED); F("normal",8); doc.text(inv.issuerReg,L+90,71);
    txt(TEAL); F("bold",30); doc.text("INVOICE",R,62,{align:"right"});
    fill(LIGHT); doc.roundedRect(R-200,74,200,42,4,4,"F");
    F("normal",7.5); txt(MUTED); doc.text("INVOICE #",R-188,90); doc.text("INVOICE DATE",R-188,106);
    F("bold",9.5); txt(INK); doc.text(inv.no,R-12,90,{align:"right"}); doc.text(fmtDate(inv.dateTs),R-12,106,{align:"right"});
    // bill to
    const lines=(inv.billTo||"").split("\n"); const bh=24+lines.length*11;
    fill(LIGHT); doc.roundedRect(L,126,CW*0.55,bh,4,4,"F"); fill(GREEN); doc.rect(L,126,3,bh,"F");
    F("bold",8); txt(TEAL); doc.text("BILL TO",L+14,142);
    lines.forEach((ln,i)=>{ F(i===0?"bold":"normal",8.5); txt(INK); doc.text(ln,L+14,156+i*11); });
    return tableHead(126+bh+18);
  };
  const contHeader=()=>{
    bands(); doc.addImage(LOGO,"JPEG",L,22,42,38);
    txt(TEAL); F("bold",10); doc.text(inv.issuerName,L+50,40); txt(MUTED); F("normal",7.5); doc.text(inv.issuerReg,L+50,51);
    txt(TEAL); F("bold",16); doc.text("INVOICE",R,40,{align:"right"}); F("normal",8); txt(INK); doc.text(`${inv.no}  ·  ${fmtDate(inv.dateTs)}  ·  continued`,R,53,{align:"right"});
    return tableHead(74);
  };
  let y=firstHeader(); const BOTTOM=H-50;
  const need=h=>{ if(y+h>BOTTOM){ doc.addPage(); y=contHeader(); } };
  inv.sections.forEach((sc,si)=>{
    need(40);
    const sub=r2(sc.lines.reduce((x,l)=>x+l.amt,0));
    fill(LIGHT); doc.rect(L,y-2,CW,18,"F"); fill(GREEN); doc.rect(L,y-2,3,18,"F");
    F("bold",8.5); txt(TEAL); doc.text(sc.title,cD,y+10); F("bold",8); doc.text(money2(sub),cA,y+10,{align:"right"});
    y+=20;
    sc.lines.forEach((l,i)=>{
      const nm=doc.splitTextToSize("-"+l.name,cU-cD-50); const rh=Math.max(15,nm.length*10+5);
      need(rh);
      if(i%2){ fill(ZEB); doc.rect(L,y-2,CW,rh,"F"); }
      F("normal",8); txt(INK); doc.text(nm,cD+6,y+8);
      doc.text(money(l.unit),cU,y+8,{align:"center"}); doc.text(String(l.qty),cQ,y+8,{align:"center"}); doc.text(money(l.amt),cA,y+8,{align:"right"});
      y+=rh;
    });
    y+=10;
  });
  need(190);
  doc.setDrawColor(...TEAL); doc.setLineWidth(.8); doc.line(L,y,R,y); y+=16;
  // totals box right
  const tx=R-200, rows=[["TOTAL",money2(inv.total)],["NET",money2(inv.total)],["TAX","0.00"],["ROUNDING ADJUSTMENT","0.00"]];
  rows.forEach((r,i)=>{ F("normal",8.5); txt(MUTED); doc.text(r[0],tx+10,y+10+i*15); F("bold",8.5); txt(INK); doc.text(r[1],R-10,y+10+i*15,{align:"right"}); });
  const gy=y+rows.length*15+2; fill(TEAL); doc.roundedRect(tx,gy,200,26,4,4,"F");
  txt([255,255,255]); F("bold",9); doc.text("GROSS (RM)",tx+10,gy+17); F("bold",12); doc.text(money2(inv.total),R-10,gy+17.5,{align:"right"});
  // words + note left
  const lw=CW-220; F("bold",8); txt(INK);
  const wl=doc.splitTextToSize(amountWords(inv.total),lw-20); fill(LIGHT); doc.roundedRect(L,y,lw,wl.length*11+14,4,4,"F"); doc.text(wl,L+10,y+14);
  let ny=y+wl.length*11+26;
  const nl=(inv.noteText||"").split("\n"); doc.setDrawColor(...GOLD); doc.setLineWidth(1); doc.roundedRect(L,ny,lw,24+nl.length*11,4,4,"S");
  F("bold",8); txt(TEAL); doc.text("NOTE",L+10,ny+14); F("normal",8); txt(INK); nl.forEach((ln,i)=>doc.text(ln,L+10,ny+27+i*11));
  // footer + page numbers
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); F("bold",7.5); txt(MUTED);
    if(i===n){ doc.text("THIS IS COMPUTER GENERATED INVOICE",W/2,H-34,{align:"center"}); doc.text("NO SIGNATURE IS REQUIRED",W/2,H-24,{align:"center"}); }
    F("normal",7); doc.text(`Page ${i} of ${n}`,R,H-18,{align:"right"}); }
  return doc;
}
async function downloadPDF(inv){
  if(!window.jspdf){toast("PDF library didn't load — reload the page");return}
  const dl=await claude.use("downloads");
  if(!dl){ toast("Downloads aren't available in this view"); return; }
  const blob=makePDF(inv).output("blob");
  try{ await dl.save({filename:`${inv.no}.pdf`,data:blob}); }
  catch(e){ if(e&&e.code!=="declined") toast("Couldn't download the PDF"); }
}
